<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert Money</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
<img class="logo" src="img/logo.png"> 
   
    <main>
        
        <label>
            converter <b>de</b>
            <select>
                <option>R$ Real Brasileiro</option>
            </select>
        </label>
        <label>
            Converter <b>para</b>
            <select class="currency-select">
                <option value="dolar">USD Dólar Americano</option>
                <option value="euro">EUR Euro</option>

            </select>

        </label>

        <label>
            Valor
            <input class="input-currency" placeholder="digite o valor aqui">
        </label>

        <button class="convert-button">Converter</button>

        <section>
			<div class="currency-box">
				<img class="currency-img" src="img/brasil 2.png" alt="Bandeira do Brasil">
				<p class="currency">R$ Real</p>
				<p class="currency-value-to-convert">R$ 0,00 </p>
			</div>

            <img class="arrow-img" src="img/Vector.png" alt="Seta">

			<div class="currency-box">
				<img class="currency-img" src="img/estados-unidos (1) 1.png" alt="Bandeira da moeda" id="currency-img">
				<p class="currency" id="currency-name">USD Dólar</p>
				<p class="currency-value">USD 0,00 </p>
			</div>

        </section>

    </main>
    <script src="scripts.js"></script>





</body>

</html>
